<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV - Free Live Hindi Channels</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg: #0a0a14;
            --card: #12122a;
            --accent: #ff2d55;
            --gold: #ffd700;
            --text: #fff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        /* TOP BAR */
        .topbar {
            background: linear-gradient(135deg, #1a0033, #0d0d2b);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 999;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-circle {
            width: 45px; height: 45px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .logo-text { font-size: 1.3rem; font-weight: 800; }
        .logo-text span { color: var(--gold); }
        .live-badge {
            background: #ff0000;
            color: #fff;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            animation: pulse 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .live-dot {
            width: 8px; height: 8px;
            background: #fff;
            border-radius: 50%;
        }
        /* MAIN */
        .main-container {
            display: flex;
            height: calc(100vh - 70px);
        }
        /* SIDEBAR */
        .sidebar {
            width: 300px;
            background: #0d0d1f;
            overflow-y: auto;
            border-right: 1px solid #222;
        }
        .sidebar-header {
            padding: 15px;
            background: linear-gradient(90deg, var(--accent), #ff6b6b);
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .category-title {
            padding: 10px 15px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--gold);
            background: #111;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .channel-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            cursor: pointer;
            transition: 0.2s;
            border-left: 3px solid transparent;
            gap: 12px;
        }
        .channel-item:hover {
            background: #1a1a35;
            border-left: 3px solid var(--accent);
        }
        .channel-item.active {
            background: #1a1a35;
            border-left: 3px solid var(--gold);
        }
        .ch-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #333, #222);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .ch-info { font-size: 0.85rem; }
        .ch-name { font-weight: 600; }
        .ch-cat { font-size: 0.7rem; color: #888; }
        /* PLAYER */
        .player-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }
        .video-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            max-height: 75vh;
            object-fit: contain;
        }
        #statusMsg {
            position: absolute;
            color: #666;
            font-size: 1.2rem;
            text-align: center;
        }
        .player-watermark {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 0.8rem;
            color: #aaa;
        }
        /* BOTTOM BAR */
        .bottombar {
            background: #111;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            border-top: 1px solid #222;
            flex-wrap: wrap;
        }
        .sponsor-link {
            color: var(--gold);
            font-weight: bold;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .sponsor-link:hover { text-decoration: underline; }
        .btn {
            background: var(--accent);
            color: #fff;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.85rem;
            transition: 0.3s;
        }
        .btn:hover { background: #ff4d6d; transform: scale(1.05); }
        .now-playing {
            color: #0f0;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .sidebar { width: 100%; max-height: 35vh; }
            .topbar { padding: 8px 12px; }
            .logo-text { font-size: 1rem; }
            video { max-height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="logo">
            <div class="logo-circle">DP</div>
            <div class="logo-text">DP <span>BHAI</span> TV</div>
        </div>
        <div class="live-badge">
            <div class="live-dot"></div> LIVE TV
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-container">

        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="sidebar-header">📺 सभी चैनल (16)</div>
            <div id="channelList"></div>
        </div>

        <!-- PLAYER -->
        <div class="player-area">
            <div class="video-wrapper">
                <video id="videoPlayer" controls style="display:none;"></video>
                <div id="statusMsg">
                    <div style="font-size:4rem;">📡</div>
                    <div>बाईं ओर से कोई चैनल चुनें</div>
                </div>
                <div class="player-watermark">DP BHAI TV</div>
            </div>
            <div class="bottombar">
                <span class="now-playing" id="nowPlaying" style="display:none;">
                    🟢 <span id="playingName"></span>
                </span>
                <a href="https://t.me/YourChannel" target="_blank" class="sponsor-link">
                    📢 Sponsor: @YourChannel
                </a>
                <a href="https://www.paypal.com/your-link" target="_blank" class="btn">
                    ❤️ Donate
                </a>
            </div>
        </div>
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusMsg = document.getElementById('statusMsg');
        const channelList = document.getElementById('channelList');
        const playingName = document.getElementById('playingName');
        const nowPlaying = document.getElementById('nowPlaying');

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelList.innerHTML = '<p style="color:red;padding:20px;">❌ प्लेलिस्ट लोड नहीं हुई!</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    current = { name, group, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderList();
        }

        function renderList() {
            const groups = {};
            channels.forEach(ch => {
                if (!groups[ch.group]) groups[ch.group] = [];
                groups[ch.group].push(ch);
            });

            let html = '';
            Object.entries(groups).forEach(([group, chs]) => {
                html += `<div class="category-title">${group}</div>`;
                chs.forEach((ch, i) => {
                    const id = channels.indexOf(ch);
                    html += `
                    <div class="channel-item" onclick="playChannel(${id})" id="ch-${id}">
                        <div class="ch-icon">📺</div>
                        <div class="ch-info">
                            <div class="ch-name">${ch.name}</div>
                            <div class="ch-cat">${ch.group}</div>
                        </div>
                    </div>`;
                });
            });
            channelList.innerHTML = html;
        }

        function playChannel(index) {
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            document.getElementById('ch-'+index)?.classList.add('active');
            
            const ch = channels[index];
            if (!ch?.url) return;

            statusMsg.style.display = 'none';
            video.style.display = 'block';
            playingName.textContent = ch.name;
            nowPlaying.style.display = 'flex';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                currentHls.on(Hls.Events.ERROR, () => {
                    statusMsg.style.display = 'block';
                    statusMsg.innerHTML = '<div>⚠️ चैनल उपलब्ध नहीं</div>';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
