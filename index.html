<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV - हिंदी लाइव चैनल</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #0f0f0f; color: #fff; min-height: 100vh; }
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; background: #0f0f0f; position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #222; flex-wrap: wrap; gap: 8px;
        }
        .logo { font-weight: 800; font-size: 1.2rem; color: #ff0000; }
        .main-content { max-width: 1200px; margin: 0 auto; padding: 15px; }
        .video-wrapper {
            background: #000; border-radius: 14px; overflow: hidden;
            aspect-ratio: 16/9; margin-bottom: 15px;
        }
        video { width: 100%; height: 100%; object-fit: contain; }
        #statusOverlay {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; height: 100%; color: #888;
        }
        .section-header { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
        .channel-strip { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
        .channel-card {
            min-width: 180px; background: #1a1a1a; border-radius: 12px;
            cursor: pointer; overflow: hidden; flex-shrink: 0;
            border: 2px solid transparent; transition: 0.2s;
        }
        .channel-card:hover { border-color: #ff0000; }
        .channel-card.active { border-color: #ffd700; }
        .card-thumb {
            width: 100%; aspect-ratio: 16/10; background: #252550;
            display: flex; align-items: center; justify-content: center;
        }
        .card-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
        .card-info { padding: 8px 10px; }
        .card-name { font-size: 0.85rem; font-weight: 600; }
        .card-cat { font-size: 0.7rem; color: #888; margin-top: 2px; }
        .sponsor-footer {
            text-align: center; padding: 15px; color: #888; font-size: 0.8rem;
            border-top: 1px solid #222; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">🔴 DP BHAI TV</div>
        <div style="font-size:0.8rem;color:#888;">5 हिंदी चैनल</div>
    </div>

    <div class="main-content">
        <div class="video-wrapper" id="videoWrapper">
            <video id="videoPlayer" controls style="display:none;"></video>
            <div id="statusOverlay">
                <div style="font-size:3rem;">📡</div>
                <div>नीचे से चैनल चुनें</div>
            </div>
        </div>

        <div class="section-header">📺 चैनल्स</div>
        <div class="channel-strip" id="channelStrip"></div>
    </div>

    <div class="sponsor-footer">
        🚀 <b>DP BHAI TV</b> | © 2026
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const channelStrip = document.getElementById('channelStrip');

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelStrip.innerHTML = '<p style="color:red;">❌ लोड नहीं हुआ</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    const logo = (line.match(/tvg-logo="([^"]+)"/) || [,''])[1];
                    current = { name, group, logo, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderChannels();
        }

        function renderChannels() {
            let html = '';
            channels.forEach((ch, index) => {
                html += `
                <div class="channel-card" onclick="playChannel(${index})" id="card-${index}">
                    <div class="card-thumb">
                        <img src="${ch.logo}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=font-size:2.5rem>📺</span>'" alt="${ch.name}">
                    </div>
                    <div class="card-info">
                        <div class="card-name">${ch.name}</div>
                        <div class="card-cat">${ch.group}</div>
                    </div>
                </div>`;
            });
            channelStrip.innerHTML = html;
        }

        function playChannel(index) {
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-'+index)?.classList.add('active');

            const ch = channels[index];
            if (!ch?.url) return;

            statusOverlay.style.display = 'none';
            video.style.display = 'block';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
