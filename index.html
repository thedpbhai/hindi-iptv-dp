<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV - हिंदी लाइव चैनल</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a1a;
            --text: #fff;
            --accent: #ff0000;
            --gold: #ffd700;
        }
        .light-mode {
            --bg: #f5f5f5;
            --card: #fff;
            --text: #111;
            --accent: #cc0000;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; transition: background 0.3s, color 0.3s; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--bg);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 8px;
            border-bottom: 1px solid #222;
            flex-wrap: wrap;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .logo-icon {
            background: var(--accent);
            width: 34px; height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: #fff;
        }
        .search-box {
            display: flex;
            flex: 1;
            max-width: 450px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 9px 40px 9px 15px;
            background: var(--card);
            border: 1px solid #444;
            border-radius: 25px;
            color: var(--text);
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input:focus { border-color: #3ea6ff; box-shadow: 0 0 0 3px rgba(62,166,255,0.2); }
        .search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 1rem;
            display: none;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .icon-btn {
            background: var(--card);
            border: 1px solid #444;
            color: var(--text);
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .icon-btn:hover { background: #333; }
        .live-badge {
            background: #ff0000;
            color: #fff !important;
            animation: livePulse 2s infinite;
            border: none;
            font-weight: 700;
        }
        @keyframes livePulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,0,0,0); }
        }
        .sponsor-btn {
            background: var(--gold);
            color: #000 !important;
            font-weight: 700;
            border: none;
        }
        .notification {
            position: fixed;
            top: 80px;
            right: 20px;
            background: #1a3a5c;
            color: #fff;
            padding: 12px 20px;
            border-radius: 10px;
            z-index: 999;
            display: none;
            animation: slideIn 0.3s;
            font-size: 0.9rem;
            border: 1px solid #3ea6ff;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .main-content {
            max-width: 1300px;
            margin: 0 auto;
            padding: 15px;
        }
        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            aspect-ratio: 16/9;
            margin-bottom: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #statusOverlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #888;
        }
        .player-controls-overlay {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            padding: 15px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            opacity: 0;
            transition: 0.3s;
        }
        .video-wrapper:hover .player-controls-overlay { opacity: 1; }
        .vid-info {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }
        .vid-left h2 { font-size: 1.15rem; font-weight: 600; }
        .vid-left p { font-size: 0.78rem; color: #888; margin-top: 2px; }
        .vid-actions {
            display: flex;
            gap: 8px;
        }
        .action-chip {
            background: var(--card);
            border: 1px solid #444;
            color: var(--text);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .action-chip:hover { background: #333; }
        .action-chip.liked { color: #ff0000; border-color: #ff0000; }
        .view-count { font-size: 0.75rem; color: #888; }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .section-header h3 { font-size: 1rem; font-weight: 600; }
        .channel-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
        }
        .channel-strip::-webkit-scrollbar { height: 5px; }
        .channel-strip::-webkit-scrollbar-thumb { background: #555; border-radius: 5px; }
        .channel-card {
            min-width: 165px;
            max-width: 180px;
            background: var(--card);
            border-radius: 14px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.25s;
            flex-shrink: 0;
            scroll-snap-align: start;
            position: relative;
            border: 2px solid transparent;
        }
        .channel-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        .channel-card.active {
            border-color: #3ea6ff;
            box-shadow: 0 0 20px rgba(62,166,255,0.3);
        }
        .card-thumb {
            width: 100%;
            aspect-ratio: 16/10;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            position: relative;
            overflow: hidden;
        }
        .card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }
        .card-fav {
            position: absolute;
            top: 8px; right: 8px;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
        .card-fav.favorited { color: #ffd700; }
        .card-info { padding: 8px 10px; }
        .card-name {
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #888;
            margin-top: 3px;
        }
        .live-dot {
            display: inline-block;
            width: 7px; height: 7px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 3px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%,100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .sponsor-footer {
            text-align: center;
            padding: 18px;
            color: #888;
            font-size: 0.82rem;
            border-top: 1px solid #222;
            margin-top: 25px;
        }
        .sponsor-footer a { color: #3ea6ff; text-decoration: none; font-weight: 600; }
        @media (max-width: 600px) {
            .topbar { padding: 8px 10px; }
            .search-box { order: 5; max-width: 100%; flex: 100%; }
            .channel-card { min-width: 140px; }
            .video-wrapper { aspect-ratio: 16/9; border-radius: 0; }
            .main-content { padding: 0; }
        }
    </style>
</head>
<body>

    <div class="notification" id="notification"></div>

    <div class="topbar">
        <div class="logo" onclick="location.reload()">
            <div class="logo-icon">▶</div>
            <span>DP BHAI TV</span>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="चैनल सर्च करें..." oninput="filterChannels()">
            <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
        </div>
        <div class="top-actions">
            <button class="icon-btn" onclick="toggleTheme()" title="Theme">🌓</button>
            <button class="icon-btn" onclick="refreshChannels()" title="Refresh">🔄</button>
            <a href="#" class="icon-btn live-badge">🔴 LIVE</a>
            <a href="https://t.me/YourChannel" target="_blank" class="icon-btn sponsor-btn">⭐ Sponsor</a>
        </div>
    </div>

    <div class="main-content">
        <div class="video-wrapper">
            <video id="videoPlayer" controls style="display:none;"></video>
            <div id="statusOverlay">
                <div style="font-size:3rem;">📡</div>
                <div>नीचे से चैनल चुनें</div>
            </div>
            <div class="player-controls-overlay">
                <button class="icon-btn" onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>

        <div class="vid-info">
            <div class="vid-left">
                <h2 id="videoTitle">🔴 कोई चैनल नहीं चल रहा</h2>
                <p id="videoMeta">5 हिंदी चैनल उपलब्ध</p>
            </div>
            <div class="vid-actions">
                <button class="action-chip" id="likeBtn" onclick="toggleLike()">👍 <span id="likeCount">0</span></button>
                <button class="action-chip" onclick="shareChannel()">📤 शेयर</button>
                <span class="view-count" id="viewCount">👁️ 0 views</span>
            </div>
        </div>

        <div class="section-header">
            <h3>📺 आपके लिए</h3>
            <span style="font-size:0.75rem;color:#888;" id="channelCount">5 चैनल</span>
        </div>
        <div class="channel-strip" id="channelStrip"></div>
    </div>

    <div class="sponsor-footer">
        🚀 <strong>Sponsored by:</strong> <a href="https://t.me/YourChannel" target="_blank">@YourChannel</a> | 
        <a href="https://www.paypal.com/your-link" target="_blank">❤️ Support Us</a> |
        © 2026 DP BHAI TV
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null, favorites = JSON.parse(localStorage.getItem('favs')||'[]');
        let currentChannel = null, viewCounts = JSON.parse(localStorage.getItem('views')||'{}');
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const channelStrip = document.getElementById('channelStrip');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');
        const notification = document.getElementById('notification');
        const searchClear = document.getElementById('searchClear');
        const channelCount = document.getElementById('channelCount');

        function notify(msg) {
            notification.textContent = msg;
            notification.style.display = 'block';
            setTimeout(() => notification.style.display = 'none', 2500);
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
        }
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light-mode');

        function toggleFullscreen() {
            const wrapper = document.querySelector('.video-wrapper');
            if (document.fullscreenElement) { document.exitFullscreen(); }
            else { wrapper.requestFullscreen().catch(()=>{}); }
        }

        function refreshChannels() {
            channelStrip.innerHTML = '<p style="padding:20px;">🔄 रिफ्रेश हो रहा है...</p>';
            loadPlaylist();
            notify('✅ चैनल रिफ्रेश हो गए!');
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderChannels(channels);
            searchClear.style.display = 'none';
        }

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelStrip.innerHTML = '<p style="color:red;padding:20px;">❌ प्लेलिस्ट लोड नहीं हुई</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    const logo = (line.match(/tvg-logo="([^"]+)"/) || [,''])[1];
                    current = { name, group, logo, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderChannels(channels);
        }

        function renderChannels(list) {
            if (list.length === 0) {
                channelStrip.innerHTML = '<p style="color:#888;padding:20px;">कोई चैनल नहीं मिला</p>';
                channelCount.textContent = '0 चैनल';
                return;
            }
            channelCount.textContent = list.length + ' चैनल';
            let html = '';
            list.forEach((ch, i) => {
                const idx = channels.indexOf(ch);
                const isFav = favorites.includes(ch.name);
                const views = viewCounts[ch.name] || 0;
                html += `
                <div class="channel-card" onclick="playChannel(${idx})" id="card-${idx}">
                    <div class="card-thumb">
                        <span style="font-size:2.5rem;">${ch.logo ? '🎬' : '📺'}</span>
                        <button class="card-fav ${isFav?'favorited':''}" onclick="event.stopPropagation();toggleFavorite('${ch.name.replace(/'/g,"\\'")}', this)">${isFav?'⭐':'☆'}</button>
                    </div>
                    <div class="card-info">
                        <div class="card-name"><span class="live-dot"></span>${ch.name}</div>
                        <div class="card-meta">
                            <span>${ch.group}</span>
                            <span>👁️ ${views}</span>
                        </div>
                    </div>
                </div>`;
            });
            channelStrip.innerHTML = html;
        }

        function filterChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            searchClear.style.display = q ? 'block' : 'none';
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(q));
            renderChannels(filtered);
        }

        function toggleFavorite(name, btn) {
            if (favorites.includes(name)) {
                favorites = favorites.filter(f => f !== name);
                btn.classList.remove('favorited');
                btn.textContent = '☆';
                notify('💔 पसंदीदा से हटाया');
            } else {
                favorites.push(name);
                btn.classList.add('favorited');
                btn.textContent = '⭐';
                notify('⭐ पसंदीदा में जोड़ा!');
            }
            localStorage.setItem('favs', JSON.stringify(favorites));
        }

        function playChannel(index) {
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-'+index)?.classList.add('active');
            document.getElementById('likeBtn').classList.remove('liked');

            const ch = channels[index];
            if (!ch?.url) return;
            currentChannel = ch;

            viewCounts[ch.name] = (viewCounts[ch.name] || 0) + 1;
            localStorage.setItem('views', JSON.stringify(viewCounts));
            document.getElementById('viewCount').textContent = '👁️ ' + viewCounts[ch.name] + ' views';

            statusOverlay.style.display = 'none';
            video.style.display = 'block';
            videoTitle.textContent = '🔴 LIVE: ' + ch.name;
            videoMeta.textContent = ch.group + ' • DP BHAI TV • अभी लाइव';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(()=>{});
                    notify('✅ चल रहा है: ' + ch.name);
                });
                currentHls.on(Hls.Events.ERROR, () => {
                    statusOverlay.style.display = 'flex';
                    statusOverlay.innerHTML = '<div style="font-size:2rem;">⚠️</div><div>यह चैनल अभी उपलब्ध नहीं</div>';
                    notify('❌ ' + ch.name + ' नहीं चल सका');
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            btn.classList.toggle('liked');
            const count = parseInt(document.getElementById('likeCount').textContent);
            document.getElementById('likeCount').textContent = btn.classList.contains('liked') ? count + 1 : count - 1;
        }

        function shareChannel() {
            if (!currentChannel) { notify('पहले कोई चैनल चलाएं!'); return; }
            const url = 'https://thedpbhai.github.io/hindi-iptv-dp/';
            if (navigator.share) {
                navigator.share({ title: currentChannel.name, text: 'DP BHAI TV पर देखें: ' + currentChannel.name, url });
            } else {
                prompt('ये लिंक कॉपी करें:', url);
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
