<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV • हिंदी लाइव चैनल</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --surface: #0f0f0f;
            --card: #1a1a1a;
            --border: #262626;
            --text: #f1f1f1;
            --text-secondary: #aaa;
            --accent: #ff0033;
            --accent-hover: #ff1a4d;
            --gold: #ffc107;
            --blue: #3ea6ff;
            --radius: 14px;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* ========== TOP BAR ========== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 12px;
            backdrop-filter: blur(20px);
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 1.3rem;
            cursor: pointer;
            user-select: none;
            letter-spacing: -0.5px;
        }
        .logo-dot {
            width: 10px; height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: logoPulse 2s infinite;
            box-shadow: 0 0 8px var(--accent);
        }
        @keyframes logoPulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.3); }
        }
        .logo span { color: var(--accent); }

        .search-wrapper {
            display: flex;
            flex: 1;
            max-width: 480px;
            position: relative;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 42px 10px 16px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text);
            font-size: 0.88rem;
            outline: none;
            transition: var(--transition);
        }
        .search-wrapper input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 4px rgba(62,166,255,0.15);
        }
        .search-wrapper .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1.1rem;
            pointer-events: none;
        }
        .top-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 24px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: var(--transition);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            letter-spacing: 0.3px;
        }
        .btn-ghost {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: #252525; }
        .btn-accent {
            background: var(--accent);
            color: #fff;
            animation: liveGlow 2s infinite;
        }
        @keyframes liveGlow {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,0,51,0.4); }
            50% { box-shadow: 0 0 0 12px rgba(255,0,51,0); }
        }
        .btn-gold {
            background: var(--gold);
            color: #000;
            font-weight: 700;
        }
        .btn-gold:hover { filter: brightness(1.1); }

        /* ========== MAIN LAYOUT ========== */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ========== PLAYER ========== */
        .player-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .video-wrapper {
            background: #000;
            border-radius: var(--radius);
            overflow: hidden;
            aspect-ratio: 16/9;
            position: relative;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            border: 1px solid var(--border);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        #statusOverlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #555;
        }
        #statusOverlay .status-icon { font-size: 4rem; margin-bottom: 12px; }
        #statusOverlay .status-text { font-size: 0.95rem; }

        .video-info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .video-info-bar h2 { font-size: 1.2rem; font-weight: 700; }
        .video-info-bar .meta { font-size: 0.8rem; color: var(--text-secondary); }
        .chip-group { display: flex; gap: 8px; }
        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 24px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-secondary);
        }
        .chip:hover { background: #252525; color: #fff; }
        .chip.active-chip { color: #fff; border-color: var(--blue); background: #1a3050; }

        /* ========== SIDEBAR ========== */
        .sidebar {
            background: var(--surface);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 75vh;
            overflow: hidden;
        }
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h3 { font-size: 0.9rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }
        .sidebar-header .count { font-size: 0.75rem; color: var(--accent); font-weight: 700; }
        .channel-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
            flex: 1;
            padding-right: 4px;
        }
        .channel-list::-webkit-scrollbar { width: 4px; }
        .channel-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .ch-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .ch-item:hover { background: var(--card); }
        .ch-item.active-item {
            background: #1a1a30;
            border-color: var(--blue);
        }
        .ch-thumb {
            width: 46px; height: 46px;
            border-radius: 10px;
            background: #1a1a2e;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }
        .ch-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }
        .ch-thumb .placeholder { font-size: 1.5rem; }
        .ch-info { flex: 1; min-width: 0; }
        .ch-info .ch-name {
            font-size: 0.85rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ch-info .ch-cat {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 1px;
        }
        .ch-status {
            width: 8px; height: 8px;
            background: #00cc66;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px #00cc66;
        }

        /* ========== FOOTER ========== */
        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 0.78rem;
            border-top: 1px solid var(--border);
            margin-top: 30px;
        }
        .footer a { color: var(--blue); text-decoration: none; font-weight: 600; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }
            .sidebar { max-height: none; }
            .topbar { padding: 8px 12px; }
            .search-wrapper { max-width: 100%; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <header class="topbar">
        <div class="logo" onclick="location.reload()">
            <div class="logo-dot"></div>
            DP<span>BHAI</span> TV
        </div>
        <div class="search-wrapper">
            <input type="text" id="searchInput" placeholder="चैनल खोजें..." oninput="filterChannels()">
            <span class="search-icon">🔍</span>
        </div>
        <div class="top-actions">
            <button class="btn btn-ghost" onclick="refreshChannels()">🔄</button>
            <a href="#" class="btn btn-accent">🔴 LIVE</a>
            <a href="https://t.me/YourChannel" target="_blank" class="btn btn-gold">⭐ Sponsor</a>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="main-grid">
        <!-- PLAYER -->
        <section class="player-section">
            <div class="video-wrapper">
                <video id="videoPlayer" controls style="display:none;"></video>
                <div id="statusOverlay">
                    <div class="status-icon">📡</div>
                    <div class="status-text">दाईं ओर से चैनल चुनें</div>
                </div>
            </div>
            <div class="video-info-bar">
                <div>
                    <h2 id="videoTitle">कोई चैनल नहीं चल रहा</h2>
                    <p class="meta" id="videoMeta">5 हिंदी चैनल उपलब्ध</p>
                </div>
                <div class="chip-group">
                    <button class="chip" id="likeBtn" onclick="toggleLike()">👍 <span id="likeCount">0</span></button>
                    <button class="chip" onclick="shareChannel()">📤 शेयर</button>
                </div>
            </div>
        </section>

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h3>📺 चैनल्स</h3>
                <span class="count" id="channelCount">5</span>
            </div>
            <div class="channel-list" id="channelList"></div>
        </aside>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        🚀 <strong>Sponsored by:</strong> <a href="https://t.me/YourChannel" target="_blank">@YourChannel</a> | 
        <a href="https://www.paypal.com/your-link" target="_blank">❤️ Support Us</a> |
        © 2026 DP BHAI TV
    </footer>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const channelList = document.getElementById('channelList');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');
        const channelCount = document.getElementById('channelCount');

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelList.innerHTML = '<p style="color:#ff4444;text-align:center;padding:20px;">❌ लोड नहीं हुआ</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    const logo = (line.match(/tvg-logo="([^"]+)"/) || [,''])[1];
                    current = { name, group, logo, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderChannels(channels);
        }

        function renderChannels(list) {
            channelCount.textContent = list.length;
            if (list.length === 0) {
                channelList.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">कोई चैनल नहीं</p>';
                return;
            }
            let html = '';
            list.forEach((ch, i) => {
                const idx = channels.indexOf(ch);
                html += `
                <div class="ch-item" onclick="playChannel(${idx})" id="ch-${idx}">
                    <div class="ch-thumb">
                        ${ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=placeholder>📺</span>'">` : '<span class="placeholder">📺</span>'}
                    </div>
                    <div class="ch-info">
                        <div class="ch-name">${ch.name}</div>
                        <div class="ch-cat">${ch.group}</div>
                    </div>
                    <div class="ch-status"></div>
                </div>`;
            });
            channelList.innerHTML = html;
        }

        function filterChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(q));
            renderChannels(filtered);
        }

        function playChannel(index) {
            document.querySelectorAll('.ch-item').forEach(el => el.classList.remove('active-item'));
            document.getElementById('ch-'+index)?.classList.add('active-item');

            const ch = channels[index];
            if (!ch?.url) return;

            statusOverlay.style.display = 'none';
            video.style.display = 'block';
            videoTitle.textContent = '🔴 ' + ch.name;
            videoMeta.textContent = ch.group + ' • DP BHAI TV';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                currentHls.on(Hls.Events.ERROR, () => {
                    statusOverlay.style.display = 'block';
                    statusOverlay.innerHTML = '<div class="status-icon">⚠️</div><div class="status-text">अनुपलब्ध</div>';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        function refreshChannels() { loadPlaylist(); }
        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            btn.classList.toggle('active-chip');
            const c = parseInt(document.getElementById('likeCount').textContent);
            document.getElementById('likeCount').textContent = btn.classList.contains('active-chip') ? c+1 : c-1;
        }
        function shareChannel() {
            if (navigator.share) navigator.share({ url: 'https://thedpbhai.github.io/hindi-iptv-dp/' });
            else prompt('URL:', 'https://thedpbhai.github.io/hindi-iptv-dp/');
        }

        loadPlaylist();
    </script>
</body>
</html>
