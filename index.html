<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV - Live Hindi Channels</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            overflow-x: hidden;
        }
        /* HEADER - YouTube Style */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px;
            background: #0f0f0f;
            border-bottom: 1px solid #272727;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .menu-icon { font-size: 1.3rem; cursor: pointer; }
        .logo {
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            background: #ff0000;
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        .header-center {
            display: flex;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }
        .search-box {
            display: flex;
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 8px 15px;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 20px 0 0 20px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }
        .search-box input:focus { border-color: #1c62b9; }
        .search-btn {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            padding: 8px 20px;
            border-radius: 0 20px 20px 0;
            color: #fff;
            cursor: pointer;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .live-btn {
            background: #ff0000;
            color: #fff;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            animation: livePulse 2s infinite;
            text-decoration: none;
        }
        @keyframes livePulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255,0,0,0); }
        }
        .sponsor-chip {
            background: #ffd700;
            color: #000;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
        }
        /* MAIN CONTENT */
        .main-content {
            display: flex;
            padding: 15px;
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }
        /* PLAYER SECTION */
        .player-section {
            flex: 1;
            max-width: 75%;
        }
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #statusOverlay {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #aaa;
        }
        #statusOverlay .icon { font-size: 4rem; }
        .video-info {
            padding: 12px 0;
        }
        .video-title {
            font-size: 1.1rem;
            font-weight: 600;
        }
        .video-meta {
            color: #aaa;
            font-size: 0.8rem;
            margin-top: 4px;
        }
        /* SIDEBAR CHANNELS */
        .sidebar {
            width: 25%;
            min-width: 280px;
        }
        .sidebar h3 {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .channel-grid {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 60vh;
            overflow-y: auto;
        }
        .channel-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            background: #1a1a1a;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .channel-card:hover { background: #272727; }
        .channel-card.active {
            background: #263850;
            border: 1px solid #3ea6ff;
        }
        .ch-thumb {
            width: 45px; height: 45px;
            background: #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .ch-details { flex: 1; min-width: 0; }
        .ch-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .ch-cat {
            font-size: 0.7rem;
            color: #888;
        }
        .live-indicator {
            width: 8px; height: 8px;
            background: #ff0000;
            border-radius: 50%;
            flex-shrink: 0;
        }
        /* SPONSOR BAR */
        .sponsor-bar {
            background: #1a1a1a;
            padding: 10px 20px;
            text-align: center;
            font-size: 0.85rem;
            border-top: 1px solid #272727;
            margin-top: 20px;
        }
        .sponsor-bar a { color: #3ea6ff; text-decoration: none; font-weight: 600; }
        .sponsor-bar a:hover { text-decoration: underline; }
        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-content { flex-direction: column; padding: 10px; }
            .player-section { max-width: 100%; }
            .sidebar { width: 100%; min-width: auto; }
            .channel-grid { max-height: 30vh; flex-direction: row; flex-wrap: wrap; gap: 8px; overflow-x: auto; }
            .channel-card { min-width: 140px; flex-shrink: 0; }
            .header-center { display: none; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="header-left">
            <span class="menu-icon">☰</span>
            <div class="logo">
                <div class="logo-icon">▶</div>
                DP BHAI TV
            </div>
        </div>
        <div class="header-center">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="चैनल सर्च करें" oninput="filterChannels()">
                <button class="search-btn">🔍</button>
            </div>
        </div>
        <div class="header-right">
            <a href="#" class="live-btn">🔴 LIVE</a>
            <a href="https://t.me/YourChannel" target="_blank" class="sponsor-chip">⭐ Sponsor</a>
        </div>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <!-- PLAYER -->
        <div class="player-section">
            <div class="video-container">
                <video id="videoPlayer" controls style="display:none;"></video>
                <div id="statusOverlay">
                    <div class="icon">📡</div>
                    <div>दाईं ओर से चैनल चुनें</div>
                </div>
            </div>
            <div class="video-info">
                <div class="video-title" id="videoTitle">कोई चैनल नहीं चल रहा</div>
                <div class="video-meta" id="videoMeta">16 चैनल उपलब्ध • DP BHAI TV</div>
            </div>
        </div>

        <!-- SIDEBAR -->
        <div class="sidebar">
            <h3>📺 सभी चैनल</h3>
            <div class="channel-grid" id="channelGrid"></div>
        </div>
    </div>

    <!-- SPONSOR -->
    <div class="sponsor-bar">
        🚀 <strong>Sponsored by:</strong> <a href="https://t.me/YourChannel" target="_blank">@YourChannel</a> | 
        <a href="https://www.paypal.com/your-link" target="_blank">❤️ Support Us</a>
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const channelGrid = document.getElementById('channelGrid');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelGrid.innerHTML = '<p style="color:red;">❌ लोड नहीं हुआ</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    current = { name, group, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderChannels(channels);
        }

        function renderChannels(list) {
            if (list.length === 0) {
                channelGrid.innerHTML = '<p style="color:#888;">कोई चैनल नहीं</p>';
                return;
            }
            let html = '';
            list.forEach((ch, i) => {
                const idx = channels.indexOf(ch);
                html += `
                <div class="channel-card" onclick="playChannel(${idx})" id="card-${idx}">
                    <div class="ch-thumb">📺</div>
                    <div class="ch-details">
                        <div class="ch-name">${ch.name}</div>
                        <div class="ch-cat">${ch.group}</div>
                    </div>
                    <div class="live-indicator"></div>
                </div>`;
            });
            channelGrid.innerHTML = html;
        }

        function filterChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(q));
            renderChannels(filtered);
        }

        function playChannel(index) {
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-'+index)?.classList.add('active');

            const ch = channels[index];
            if (!ch?.url) return;

            statusOverlay.style.display = 'none';
            video.style.display = 'block';
            videoTitle.textContent = '🔴 LIVE: ' + ch.name;
            videoMeta.textContent = ch.group + ' • DP BHAI TV';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                currentHls.on(Hls.Events.ERROR, () => {
                    statusOverlay.style.display = 'flex';
                    statusOverlay.innerHTML = '<div>⚠️ अनुपलब्ध</div>';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
