<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV • हिंदी लाइव चैनल</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        :root {
            --bg: #030303;
            --surface: #0f0f0f;
            --card: #1a1a1a;
            --border: #262626;
            --text: #f1f1f1;
            --text-secondary: #aaa;
            --accent: #ff0033;
            --gold: #ffc107;
            --blue: #3ea6ff;
            --radius: 14px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* TOP BAR */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 20px; background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap;
        }
        .logo { font-size: 1.3rem; font-weight: 800; color: var(--accent); cursor: pointer; white-space: nowrap; }
        .logo span { color: #fff; }
        .search-box {
            display: flex; flex: 1; max-width: 400px; position: relative;
        }
        .search-box input {
            width: 100%; padding: 9px 40px 9px 15px;
            background: var(--card); border: 1px solid var(--border);
            border-radius: 25px; color: var(--text); font-size: 0.85rem; outline: none;
        }
        .search-box input:focus { border-color: var(--blue); }
        .search-icon { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #888; }
        .top-btns { display: flex; gap: 8px; }
        .btn {
            padding: 8px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: 600;
            cursor: pointer; text-decoration: none; border: none; white-space: nowrap;
        }
        .btn-live { background: var(--accent); color: #fff; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,0,51,.4)} 50%{box-shadow:0 0 0 10px rgba(255,0,51,0)} }
        .btn-sponsor { background: var(--gold); color: #000; }
        .btn-refresh { background: var(--card); color: #fff; border: 1px solid var(--border); }

        /* MAIN */
        .main-content { max-width: 1400px; margin: 0 auto; padding: 15px; }

        /* PLAYER */
        .video-wrapper {
            background: #000; border-radius: var(--radius); overflow: hidden;
            aspect-ratio: 16/9; margin-bottom: 12px; position: relative;
            border: 1px solid var(--border);
        }
        video { width: 100%; height: 100%; object-fit: contain; display: block; }
        #statusOverlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; color: #555;
        }
        .now-playing {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid #222; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
        }
        .now-playing h2 { font-size: 1.1rem; font-weight: 700; }
        .now-playing .meta { font-size: 0.78rem; color: #888; }

        /* CATEGORY SECTIONS */
        .cat-section { margin-bottom: 25px; }
        .cat-header {
            display: flex; align-items: center; gap: 8px;
            font-size: 1rem; font-weight: 700; margin-bottom: 12px;
        }
        .cat-icon { font-size: 1.3rem; }
        .cat-count { font-size: 0.75rem; color: #888; font-weight: 400; }
        .channel-row {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
            scroll-behavior: smooth;
        }
        .channel-row::-webkit-scrollbar { height: 4px; }
        .channel-row::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        .ch-card {
            min-width: 180px; max-width: 200px; background: var(--card);
            border-radius: 12px; overflow: hidden; cursor: pointer;
            transition: 0.2s; flex-shrink: 0; border: 2px solid transparent;
            position: relative;
        }
        .ch-card:hover { transform: translateY(-4px); border-color: var(--accent); }
        .ch-card.active { border-color: var(--gold); box-shadow: 0 0 15px rgba(255,215,0,0.3); }
        .ch-card .live-tag {
            position: absolute; top: 8px; left: 8px;
            background: var(--accent); color: #fff; padding: 3px 8px;
            border-radius: 4px; font-size: 0.6rem; font-weight: 700; z-index: 2;
        }
        .ch-thumb {
            width: 100%; aspect-ratio: 16/10; background: #1a1a2e;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .ch-thumb img { width: 100%; height: 100%; object-fit: contain; padding: 10px; }
        .ch-info { padding: 10px; }
        .ch-name { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .ch-cat { font-size: 0.7rem; color: #888; margin-top: 2px; }

        /* FOOTER */
        .footer {
            text-align: center; padding: 20px; color: #555; font-size: 0.78rem;
            border-top: 1px solid #222; margin-top: 30px;
        }
        .footer a { color: var(--blue); text-decoration: none; }

        @media (max-width: 600px) {
            .ch-card { min-width: 150px; }
            .topbar { padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="logo" onclick="location.reload()">🔴 DP<span>BHAI</span> TV</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="चैनल खोजें..." oninput="filterChannels()">
            <span class="search-icon">🔍</span>
        </div>
        <div class="top-btns">
            <button class="btn btn-refresh" onclick="location.reload()">🔄</button>
            <a href="#" class="btn btn-live">🔴 LIVE</a>
            <a href="https://t.me/YourChannel" target="_blank" class="btn btn-sponsor">⭐ Sponsor</a>
        </div>
    </header>

    <main class="main-content">
        <div class="video-wrapper">
            <video id="videoPlayer" controls style="display:none;"></video>
            <div id="statusOverlay">
                <div style="font-size:3rem;">📡</div>
                <div>नीचे से चैनल चुनें</div>
            </div>
        </div>

        <div class="now-playing">
            <h2 id="videoTitle">🔴 कोई चैनल नहीं चल रहा</h2>
            <span class="meta" id="videoMeta">5 चैनल उपलब्ध</span>
        </div>

        <div id="allCategories"></div>
    </main>

    <footer class="footer">
        🚀 <b>DP BHAI TV</b> | <a href="https://t.me/YourChannel">@YourChannel</a> | © 2026
    </footer>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const allCategories = document.getElementById('allCategories');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');

        const CAT_ICONS = {
            'Hindi Movies': '🎬',
            'Hindi Music': '🎵',
            'Sports': '🏏',
            'News': '📰',
            'Kids': '🧒',
            'Entertainment': '🎭'
        };

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                allCategories.innerHTML = '<p style="color:red;text-align:center;">❌ लोड नहीं हुआ</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    const logo = (line.match(/tvg-logo="([^"]+)"/) || [,''])[1];
                    current = { name, group, logo, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderByCategory(channels);
        }

        function renderByCategory(list) {
            const cats = {};
            list.forEach(ch => {
                if (!cats[ch.group]) cats[ch.group] = [];
                cats[ch.group].push(ch);
            });

            let html = '';
            for (const [cat, chs] of Object.entries(cats)) {
                const icon = CAT_ICONS[cat] || '📺';
                html += `
                <div class="cat-section">
                    <div class="cat-header">
                        <span class="cat-icon">${icon}</span> ${cat}
                        <span class="cat-count">(${chs.length})</span>
                    </div>
                    <div class="channel-row">`;
                
                chs.forEach(ch => {
                    const idx = channels.indexOf(ch);
                    html += `
                        <div class="ch-card" onclick="playChannel(${idx})" id="card-${idx}">
                            <div class="live-tag">LIVE</div>
                            <div class="ch-thumb">
                                ${ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=font-size:2.5rem>📺</span>'">` : '<span style="font-size:2.5rem;">📺</span>'}
                            </div>
                            <div class="ch-info">
                                <div class="ch-name">${ch.name}</div>
                                <div class="ch-cat">${ch.group}</div>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
            }
            allCategories.innerHTML = html;
            videoMeta.textContent = list.length + ' चैनल उपलब्ध';
        }

        function filterChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => 
                ch.name.toLowerCase().includes(q) || ch.group.toLowerCase().includes(q)
            );
            renderByCategory(filtered);
        }

        function playChannel(index) {
            document.querySelectorAll('.ch-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-'+index)?.classList.add('active');

            const ch = channels[index];
            if (!ch?.url) return;

            statusOverlay.style.display = 'none';
            video.style.display = 'block';
            videoTitle.textContent = '🔴 LIVE: ' + ch.name;
            videoMeta.textContent = ch.group + ' • DP BHAI TV';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                currentHls.on(Hls.Events.ERROR, () => {
                    statusOverlay.style.display = 'block';
                    statusOverlay.innerHTML = '<div style="font-size:2rem;">⚠️</div><div>अनुपलब्ध</div>';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
