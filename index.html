<!DOCTYPE html>
<html lang="hi" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DP BHAI TV 👑 प्रीमियम IPTV - VLC Streams</title>
    <!-- HLS.js for modern streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #000000;
            --surface: #0a0a0a;
            --card: #111111;
            --border: #1f1f1f;
            --text: #ffffff;
            --text-secondary: #999999;
            --accent: #ff0040;
            --accent-glow: rgba(255,0,64,0.3);
            --gold: #ffd700;
            --gold-glow: rgba(255,215,0,0.2);
            --gradient-1: linear-gradient(135deg, #ff0040, #ff6b00);
            --gradient-2: linear-gradient(135deg, #1a1a2e, #0f0f23);
            --glass: rgba(255,255,255,0.03);
            --glass-border: rgba(255,255,255,0.06);
            --shadow: 0 20px 60px rgba(0,0,0,0.5);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        [data-theme="light"] {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --card: #ffffff;
            --border: #e0e0e0;
            --text: #111111;
            --text-secondary: #666666;
            --accent: #e6003a;
            --accent-glow: rgba(230,0,58,0.15);
            --gold: #cc9900;
            --gold-glow: rgba(204,153,0,0.15);
            --gradient-1: linear-gradient(135deg, #e6003a, #ff6b00);
            --gradient-2: linear-gradient(135deg, #f0f0f5, #e8e8f0);
            --glass: rgba(0,0,0,0.02);
            --glass-border: rgba(0,0,0,0.06);
            --shadow: 0 20px 60px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: var(--safe-bottom);
        }

        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 1000;
            gap: 10px;
            flex-wrap: wrap;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: var(--gradient-1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 900;
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
        }

        .logo-text {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-text .accent { color: var(--accent); }
        .premium {
            font-size: 0.45rem;
            background: var(--gradient-1);
            color: #fff;
            padding: 2px 5px;
            border-radius: 3px;
            vertical-align: super;
            margin-left: 2px;
            letter-spacing: 1px;
        }

        .search-wrapper {
            flex: 1;
            min-width: 140px;
            max-width: 100%;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            padding: 9px 38px 9px 14px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font-size: 0.82rem;
            outline: none;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
        }

        .search-wrapper input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .search-wrapper .s-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.9rem;
            opacity: 0.5;
        }

        .action-group {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .btn {
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            border: none;
            transition: var(--transition);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-icon {
            width: 30px;
            height: 30px;
            padding: 0;
            justify-content: center;
            border-radius: 50%;
            font-size: 0.85rem;
        }

        .btn-ghost {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .btn-ghost:hover { background: var(--border); }

        .btn-accent {
            background: var(--gradient-1);
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
            animation: accentPulse 3s infinite;
        }

        @keyframes accentPulse {
            0%, 100% { box-shadow: 0 6px 20px var(--accent-glow); }
            50% { box-shadow: 0 10px 30px rgba(255,0,64,0.5); }
        }

        .btn-gold {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            box-shadow: 0 6px 20px var(--gold-glow);
        }

        .main-content {
            width: 100%;
            max-width: 100%;
            margin: 0 auto;
            padding: 12px 12px 20px;
        }

        .player-card {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            aspect-ratio: 16/9;
            position: relative;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #statusOverlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0.7;
            font-size: 0.9rem;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .info-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .info-bar h2 {
            font-size: 1rem;
            font-weight: 700;
        }

        .info-bar .meta {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .chip-row {
            display: flex;
            gap: 6px;
        }

        .chip {
            background: var(--card);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.7rem;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 500;
            color: var(--text-secondary);
        }

        .chip.liked {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .cat-section {
            margin-bottom: 24px;
        }

        .cat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .cat-dot {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent);
        }

        .cat-count {
            font-size: 0.65rem;
            color: var(--text-secondary);
            font-weight: 500;
            background: var(--card);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .channel-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 6px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .channel-row::-webkit-scrollbar {
            height: 3px;
        }

        .channel-row::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .ch-card {
            min-width: 150px;
            max-width: 170px;
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
            border: 1px solid var(--border);
            position: relative;
            box-shadow: 0 3px 15px rgba(0,0,0,0.2);
        }

        .ch-card:active { transform: scale(0.96); }

        .ch-card.active {
            border-color: var(--gold);
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .badge-tag {
            position: absolute;
            top: 6px;
            left: 6px;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 0.5rem;
            font-weight: 700;
            z-index: 2;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .badge-free { background: #00cc66; }
        .badge-paid { background: #ff0040; }
        .badge-vip { background: #ffd700; color: #000; }

        .ch-thumb {
            width: 100%;
            aspect-ratio: 16/10;
            background: var(--gradient-2);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .ch-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 8px;
        }

        .ch-info {
            padding: 10px;
        }

        .ch-name {
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ch-cat {
            font-size: 0.65rem;
            color: var(--text-secondary);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .ch-cat::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #00cc66;
            border-radius: 50%;
            box-shadow: 0 0 4px #00cc66;
        }

        .footer-premium {
            text-align: center;
            padding: 16px;
            color: var(--text-secondary);
            font-size: 0.7rem;
            border-top: 1px solid var(--border);
            margin-top: 30px;
            background: var(--glass);
        }

        .footer-premium a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .status-msg {
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<header class="topbar">

        <div><h2 id="videoTitle">👑 DP BHAI TV PRO</h2><p class="meta" id="videoMeta">प्रीमियम स्ट्रीम्स • VLC सपोर्ट</p></div>

</main>

<footer class="footer-premium">

</footer>

<script>
    // ---------- FIREBASE INIT ----------
    const firebaseConfig = {
        apiKey: "AIzaSyDy4pxl68z8N7yDZfKBpZbMkfcGxtBu1JQ",
        authDomain: "dpbhai-tv.firebaseapp.com",
        projectId: "dpbhai-tv",
        storageBucket: "dpbhai-tv.firebasestorage.app",
        messagingSenderId: "361265848465",
        appId: "1:361265848465:web:bb2c78a3cbded7180d1f30"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ---------- MASTER STREAM LIST (VLC ready) ----------
    // This includes various working streams that are compatible with VLC, MPV, FFplay
    // Mixed formats: .m3u8, direct .ts, .mpd and other http streams.
    const MASTER_STREAMS = [
        // News & Hindi Entertainment - VLC compatible
        { }
    ];

    let channels = [];
    let currentHls = null;
    const video = document.getElementById('videoPlayer');
    const statusOverlay = document.getElementById('statusOverlay');
    const allCategories = document.getElementById('allCategories');
    const videoTitle = document.getElementById('videoTitle');
    const videoMeta = document.getElementById('videoMeta');
    const searchInput = document.getElementById('searchInput');

    // User ID
    if (!localStorage.getItem('userId')) {
        localStorage.setItem('userId', 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9));
    }
    const userId = localStorage.getItem('userId');

    // ----- Theme handling -----
    function toggleTheme() {
        const html = document.documentElement;
        const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    }
    (function() {
        const saved = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', saved);
    })();

    // ----- Load initial streams (from master + fallback firestore) -----
    async function loadChannels() {
        // First: built-in VLC-ready streams
        channels = [...MASTER_STREAMS];
        
        // Try to load additional channels from Firestore to enrich playlist
        try {
            const snap = await db.collection('channels').limit(30).get();
            snap.forEach(doc => {
                const ch = doc.data();
                if (ch && ch.url && ch.name) {
                    // avoid duplicates by url
                    const exists = channels.some(c => c.url === ch.url);
                    if (!exists) {
                        channels.push({
                            name: ch.name,
                            group: ch.category || ch.group || "Premium",
                            url: ch.url,
                            logo: ch.logo || "",
                            type: ch.type || "free"
                        });
                    }
                }
            });
        } catch(e) { /* silent fail, keep master list */ }
        
        // If still empty? fallback to master again
        if (channels.length === 0) channels = [...MASTER_STREAMS];
        
        renderByCategory(channels);
    }

    function renderByCategory(list) {
        const cats = {};
        list.forEach(ch => {
            // अगर group नहीं है तो इस चैनल को स्किप करें
if (!ch.group) return;
const cat = ch.group;
            if (!cats[cat]) cats[cat] = [];
            cats[cat].push(ch);
        });

        let html = '';
        for (const [cat, chs] of Object.entries(cats)) {
            html += `<div class="cat-section"><div class="cat-header"><span class="cat-dot"></span> ${cat} <span class="cat-count">${chs.length}</span></div><div class="channel-row">`;
            chs.forEach((ch, idx) => {
                const globalIdx = channels.findIndex(c => c.url === ch.url && c.name === ch.name);
                const type = ch.type || 'free';
                let badgeClass = 'badge-free';
                let badgeText = 'FREE';
                if (type === 'paid') { badgeClass = 'badge-paid'; badgeText = 'PAID'; }
                else if (type === 'vip') { badgeClass = 'badge-vip'; badgeText = 'VIP'; }
                
                const thumbHtml = ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none';this.parentElement.innerHTML='<span style=font-size:2rem>📺</span>'">` : '<span style="font-size:2rem;">📺</span>';
                html += `
                    <div class="ch-card" onclick="playChannelByUrl('${escapeHtml(ch.url)}', '${escapeHtml(ch.name)}', '${cat}', ${globalIdx})" id="card-${globalIdx}">
                        <div class="badge-tag ${badgeClass}">${badgeText}</div>
                        <div class="ch-thumb">
                            ${thumbHtml}
                        </div>
                        <div class="ch-info">
                            <div class="ch-name">${escapeHtml(ch.name)}</div>
                            <div class="ch-cat">${escapeHtml(cat)}</div>
                        </div>
                    </div>`;
            });
            html += `</div></div>`;
        }
        allCategories.innerHTML = html || '<p style="text-align:center;padding:30px;">⚡ कोई चैनल नहीं मिला</p>';
        videoMeta.textContent = list.length + ' चैनल • VLC कम्पैटिबल';
    }

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Search filter
    searchInput.addEventListener('input', () => {
        const q = searchInput.value.toLowerCase();
        const filtered = channels.filter(ch => ch.name.toLowerCase().includes(q) || (ch.group && ch.group.toLowerCase().includes(q)));
        renderByCategory(filtered);
    });

    // ----- membership check for paid/vip -----
    async function checkMembership() {
        try {
            const doc = await db.collection('users').doc(userId).get();
            if (doc.exists && doc.data().expiry && doc.data().expiry > new Date().toISOString()) return true;
        } catch(e) {}
        return false;
    }

    function showPaymentPopup() {
        const popup = document.createElement('div');
        popup.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.96);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px);';
        popup.innerHTML = `
            <div style="background:var(--surface);padding:25px;border-radius:24px;text-align:center;max-width:400px;width:100%;border:1px solid var(--gold);">
                <h2 style="color:var(--gold);">👑 प्रीमियम एक्सेस</h2>
                <p style="color:var(--text-secondary);margin:10px 0;">यह VIP/PAID चैनल है। मेंबरशिप लें और सभी HD स्ट्रीम्स का आनंद लें (VLC compatible)</p>
                <div id="popupPlans" style="text-align:left;margin:15px 0;"></div>
                <div id="popupQR" style="margin-top:10px;"></div>
                <button onclick="this.closest('div').parentElement.remove()" style="margin-top:20px;padding:10px 30px;background:var(--accent);border:none;border-radius:40px;color:#fff;font-weight:bold;cursor:pointer;">वापस जाएं</button>
            </div>`;
        document.body.appendChild(popup);
        
        db.collection('plans').get().then(snap => {
            let html = '<h4 style="color:var(--gold);">📋 सदस्यता योजनाएं:</h4>';
            if(snap.empty) html += '<p>✨ 1 महीना ₹199, 3 महीने ₹499, 1 साल ₹1499</p>';
            snap.forEach(doc => {
                const p = doc.data();
                html += `<div style="background:var(--card);padding:10px;margin:8px 0;border-radius:12px;"><b>${p.name}</b> - ₹${p.price} / ${p.duration} दिन<br><small>${p.features || 'सभी प्रीमियम चैनल'}</small></div>`;
            });
            document.getElementById('popupPlans').innerHTML = html;
        }).catch(()=> {
            document.getElementById('popupPlans').innerHTML = '<div><b>⭐ VIP प्लान</b><br>महीना ₹299 | सालाना ₹2499<br>📞 संपर्क करें: @DPBHAI</div>';
        });
        
        db.collection('settings').doc('payment').get().then(doc => {
            if(doc.exists) {
                const d = doc.data();
                let html = '<h4 style="color:var(--gold);">💸 भुगतान विकल्प:</h4>';
                if(d.upiId) html += `<p>UPI: <b>${d.upiId}</b></p>`;
                if(d.qrImageUrl) html += `<img src="${d.qrImageUrl}" style="width:180px;border-radius:12px;margin-top:8px;">`;
                document.getElementById('popupQR').innerHTML = html;
            } else {
                document.getElementById('popupQR').innerHTML = '<p>📱 UPI: dpbhai@okhdfcbank | QR टेलीग्राम पर उपलब्ध</p>';
            }
        }).catch(()=>{
            document.getElementById('popupQR').innerHTML = '<p>📱 UPI: dpbhai@okhdfcbank | @DPBHAI पर संपर्क करें</p>';
        });
    }

    // Core play function with VLC compatibility (HLS + native)
    async function playChannelByUrl(url, name, category, idx) {
        if (!url) return;
        // Find original channel object to detect type
        const channelObj = channels.find(c => c.url === url) || { type: 'free', name: name };
        
        if (channelObj.type === 'paid' || channelObj.type === 'vip') {
            const hasAccess = await checkMembership();
            if (!hasAccess) {
                showPaymentPopup();
                return;
            }
        }
        
        // UI active highlight
        document.querySelectorAll('.ch-card').forEach(el => el.classList.remove('active'));
        const activeCard = document.getElementById('card-'+idx);
        if (activeCard) activeCard.classList.add('active');
        
        video.style.display = 'block';
        statusOverlay.style.display = 'none';
        videoTitle.textContent = '🔴 ' + name;
        videoMeta.textContent = (category || 'Premium') + ' • VLC स्ट्रीम';
        
        // Destroy old HLS
        if (currentHls) { currentHls.destroy(); currentHls = null; }
        
        // For HLS streams -> use HLS.js else native (also mp4/ts etc works natively)
        if (Hls.isSupported() && (url.includes('.m3u8') || url.includes('m3u8'))) {
            currentHls = new Hls({ debug: false, enableWorker: true });
            currentHls.loadSource(url);
            currentHls.attachMedia(video);
            currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                video.play().catch(err => console.warn("Autoplay blocked:", err));
            });
            currentHls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusOverlay.style.display = 'block';
                    statusOverlay.innerHTML = '<span style="font-size:1.8rem;">⚠️</span><br>स्ट्रीम लोड नहीं हुई (VLC लिंक हो सकता है)';
                    video.style.display = 'none';
                }
            });
        } else {
            // For direct .ts, .mp4, .mkv or any VLC-friendly link (including HTTP streams)
            video.src = url;
            video.load();
            video.play().catch(err => {
                statusOverlay.style.display = 'block';
                statusOverlay.innerHTML = '<span>❗ स्ट्रीम शुरू नहीं हुई, कृपया दोबारा प्रयास करें</span>';
            });
        }
        
        // Additional fallback: if video hangs, show reconnection hint
        video.onerror = () => {
            statusOverlay.style.display = 'block';
            statusOverlay.innerHTML = '<span>📡 लिंक काम नहीं कर रहा, दूसरा चैनल चुनें</span>';
            video.style.display = 'none';
        };
    }
    
    // Legacy support for onclick via index (backward)
    async function playChannel(index) {
        if (index >= 0 && channels[index]) {
            const ch = channels[index];
            await playChannelByUrl(ch.url, ch.name, ch.group, index);
        }
    }
    
    // Like & share feature
    function toggleLike() {
        const btn = document.getElementById('likeBtn');
        btn.classList.toggle('liked');
        let c = parseInt(document.getElementById('likeCount').textContent);
        document.getElementById('likeCount').textContent = btn.classList.contains('liked') ? c+1 : (c>0?c-1:0);
        localStorage.setItem('channelLiked', btn.classList.contains('liked') ? 'true' : 'false');
    }
    
    function shareSite() {
        if (navigator.share) navigator.share({ title: 'DP BHAI TV VIP', text: 'प्रीमियम IPTV हिंदी चैनल VLC सपोर्ट', url: location.href });
        else prompt('📋 लिंक कॉपी करें:', location.href);
    }
    
    // restore like count
    (function initLike() {
        const liked = localStorage.getItem('channelLiked') === 'true';
        if (liked) {
            const btn = document.getElementById('likeBtn');
            btn.classList.add('liked');
            document.getElementById('likeCount').textContent = '1';
        } else document.getElementById('likeCount').textContent = '0';
    })();
    
    // Initialize the full player
    loadChannels();
</script>
</body>
