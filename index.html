<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP BHAI TV - Hindi Live Channels</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }
        /* TOP BAR */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #0f0f0f;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 10px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            white-space: nowrap;
        }
        .logo-icon {
            background: #ff0000;
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }
        .search-box {
            display: flex;
            flex: 1;
            max-width: 500px;
        }
        .search-box input {
            width: 100%;
            padding: 8px 15px;
            background: #121212;
            border: 1px solid #303030;
            border-radius: 20px 0 0 20px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .search-box input:focus { border-color: #3ea6ff; }
        .search-box button {
            background: #222;
            border: 1px solid #303030;
            border-left: none;
            padding: 8px 15px;
            border-radius: 0 20px 20px 0;
            color: #fff;
            cursor: pointer;
        }
        .live-badge {
            background: #ff0000;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            animation: pulse 2s infinite;
            white-space: nowrap;
            text-decoration: none;
        }
        @keyframes pulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,0,0,0.4); }
            50% { box-shadow: 0 0 0 10px rgba(255,0,0,0); }
        }
        .sponsor-btn {
            background: #ffd700;
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            white-space: nowrap;
        }
        /* MAIN CONTENT */
        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px;
        }
        /* VIDEO PLAYER */
        .video-container {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 12px;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #statusOverlay {
            position: absolute;
            text-align: center;
            color: #888;
        }
        #statusOverlay .icon { font-size: 3rem; }
        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .video-meta {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 20px;
        }
        /* CHANNEL SECTION */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .channel-strip {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scroll-behavior: smooth;
        }
        .channel-strip::-webkit-scrollbar { height: 4px; }
        .channel-strip::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        .channel-card {
            min-width: 160px;
            max-width: 180px;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .channel-card:hover { background: #272727; transform: translateY(-2px); }
        .channel-card.active {
            background: #1a3a5c;
            border: 2px solid #3ea6ff;
        }
        .card-thumb {
            width: 100%;
            aspect-ratio: 16/10;
            background: #252525;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .card-info {
            padding: 8px 10px;
        }
        .card-name {
            font-size: 0.8rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-cat {
            font-size: 0.7rem;
            color: #888;
        }
        .live-dot {
            display: inline-block;
            width: 6px; height: 6px;
            background: #ff0000;
            border-radius: 50%;
            margin-right: 4px;
        }
        /* SPONSOR */
        .sponsor-footer {
            text-align: center;
            padding: 15px;
            color: #888;
            font-size: 0.85rem;
            border-top: 1px solid #222;
            margin-top: 20px;
        }
        .sponsor-footer a { color: #3ea6ff; text-decoration: none; font-weight: 600; }
        /* RESPONSIVE */
        @media (max-width: 600px) {
            .topbar { flex-wrap: wrap; gap: 8px; }
            .search-box { order: 3; max-width: 100%; flex: 100%; }
            .channel-card { min-width: 140px; }
            .video-container { aspect-ratio: 16/9; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="logo">
            <div class="logo-icon">▶</div>
            DP BHAI TV
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="चैनल सर्च करें..." oninput="filterChannels()">
            <button>🔍</button>
        </div>
        <a href="#" class="live-badge">🔴 LIVE</a>
        <a href="https://t.me/YourChannel" target="_blank" class="sponsor-btn">⭐ Sponsor</a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- VIDEO PLAYER -->
        <div class="video-container">
            <video id="videoPlayer" controls style="display:none;"></video>
            <div id="statusOverlay">
                <div class="icon">📡</div>
                <div>नीचे से चैनल चुनें</div>
            </div>
        </div>
        <div class="video-title" id="videoTitle">🔴 कोई चैनल नहीं चल रहा</div>
        <div class="video-meta" id="videoMeta">16 हिंदी चैनल • DP BHAI TV</div>

        <!-- CHANNEL LIST -->
        <div class="section-title">📺 आपके लिए</div>
        <div class="channel-strip" id="channelStrip"></div>
    </div>

    <!-- SPONSOR FOOTER -->
    <div class="sponsor-footer">
        🚀 <strong>Sponsored by:</strong> <a href="https://t.me/YourChannel" target="_blank">@YourChannel</a> | 
        <a href="https://www.paypal.com/your-link" target="_blank">❤️ Support Us</a>
    </div>

    <script>
        const M3U_URL = 'https://raw.githubusercontent.com/thedpbhai/hindi-iptv-dp/main/hindi_working.m3u';
        let channels = [], currentHls = null;
        const video = document.getElementById('videoPlayer');
        const statusOverlay = document.getElementById('statusOverlay');
        const channelStrip = document.getElementById('channelStrip');
        const videoTitle = document.getElementById('videoTitle');
        const videoMeta = document.getElementById('videoMeta');

        async function loadPlaylist() {
            try {
                const res = await fetch(M3U_URL);
                const text = await res.text();
                parseM3U(text);
            } catch(e) {
                channelStrip.innerHTML = '<p style="color:red;">❌ लोड नहीं हुआ</p>';
            }
        }

        function parseM3U(data) {
            channels = [];
            let current = null;
            data.split('\n').forEach(line => {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const name = (line.match(/,(.+)$/) || [,'Unknown'])[1];
                    const group = (line.match(/group-title="([^"]+)"/) || [,'Other'])[1];
                    current = { name, group, url: '' };
                } else if (line && !line.startsWith('#') && current) {
                    current.url = line;
                    channels.push(current);
                    current = null;
                }
            });
            renderChannels(channels);
        }

        function renderChannels(list) {
            if (list.length === 0) {
                channelStrip.innerHTML = '<p style="color:#888;">कोई चैनल नहीं</p>';
                return;
            }
            let html = '';
            list.forEach((ch, i) => {
                const idx = channels.indexOf(ch);
                html += `
                <div class="channel-card" onclick="playChannel(${idx})" id="card-${idx}">
                    <div class="card-thumb">📺</div>
                    <div class="card-info">
                        <div class="card-name"><span class="live-dot"></span>${ch.name}</div>
                        <div class="card-cat">${ch.group}</div>
                    </div>
                </div>`;
            });
            channelStrip.innerHTML = html;
        }

        function filterChannels() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = channels.filter(ch => ch.name.toLowerCase().includes(q));
            renderChannels(filtered);
        }

        function playChannel(index) {
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
            document.getElementById('card-'+index)?.classList.add('active');

            const ch = channels[index];
            if (!ch?.url) return;

            statusOverlay.style.display = 'none';
            video.style.display = 'block';
            videoTitle.textContent = '🔴 LIVE: ' + ch.name;
            videoMeta.textContent = ch.group + ' • DP BHAI TV';

            if (currentHls) { currentHls.destroy(); currentHls = null; }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(()=>{}));
                currentHls.on(Hls.Events.ERROR, () => {
                    statusOverlay.style.display = 'flex';
                    statusOverlay.innerHTML = '<div>⚠️ अनुपलब्ध</div>';
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.play().catch(()=>{});
            }
        }

        loadPlaylist();
    </script>
</body>
</html>
